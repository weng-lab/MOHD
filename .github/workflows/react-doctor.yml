# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Docs: https://www.react.doctor/ci
# Source: https://github.com/millionco/react-doctor

name: React Doctor

on:
  # Scans the whole project (see `scope: full` below) and posts a sticky summary comment with the findings.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Scans `staging` on every push to track the health-score trend and catch regressions that slipped past PR review.
  push:
    branches: ["staging"]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

# Cancels any in-flight scan for the same PR (or branch, on push) the moment a new commit arrives, so reviewers only ever see the latest run.
concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives React Doctor the full git history it needs to find the merge base with the target branch. Without it a shallow checkout has no merge base, so PR runs can't compare against the base and fall back to reporting every issue in the changed files (pre-existing ones included) instead of only the ones the PR introduced.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # React Doctor's dead-code rules resolve imports through a real
      # node_modules tree, and the action does not install for you. On a bare
      # checkout every dependency that is only reached indirectly looks unused —
      # rxjs, for instance, is a required peer of @apollo/client that no source
      # file imports directly. Those are false positives that disappear once the
      # tree is installed, so install before scanning.
      #
      # Node 24 matches the react-doctor action's own default, so the install
      # and the scan run under the same runtime.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node v5 turns package-manager caching on by default. It probes
          # `yarn --version` to decide which package manager it is dealing with,
          # and that probe runs inside this step — before `corepack enable`
          # below, using the image's global Yarn. We already cache the Yarn
          # store explicitly a few steps down, so turn the built-in off rather
          # than have two steps caching the same directory under different keys.
          package-manager-cache: false

      # The runner image ships Yarn 1.22.22 on PATH. Two things stop it from
      # being what actually runs: .yarnrc.yml sets `yarnPath` to the Yarn 4.12.0
      # release committed under .yarn/releases, which Yarn 1 detects and hands
      # off to, and corepack reads package.json's `packageManager` field and
      # routes `yarn` to the same version. The committed release is the load
      # bearing half — without it Yarn 1 refuses to run at all, since it sees
      # `packageManager: yarn@4.12.0` and has nothing to delegate to.
      - run: corepack enable

      # Yarn 4 defaults to `enableGlobalCache: true` and keeps package archives
      # in ~/.yarn/berry/cache, not in the project — that default holds under CI
      # too, so this is the path worth caching. Keying on yarn.lock reuses the
      # cache verbatim until a dependency actually changes; restore-keys lets a
      # near-miss still warm most of the tree.
      - uses: actions/cache@v5
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - run: yarn install --immutable

      - uses: millionco/react-doctor@v2
        # `scope: full` is what makes the dead-code rules work at all.
        # unused-export and the dependency rules are whole-program analyses: to
        # prove an export is unused you have to inspect every file that could
        # import it. Under the action's default `changed` scope only the PR's
        # changed files are scanned, so those rules have no import graph to
        # reason about and silently never fire.
        #
        # The tradeoff is that `full` reports the whole project rather than only
        # what the PR introduced, so with `blocking: warning` any pre-existing
        # finding fails every open PR — the baseline has to stay clean. Drop to
        # `blocking: error` if warning-severity findings become noisy; they will
        # still show up in the summary comment and the score.
        # Full reference: https://www.react.doctor/ci
        with:
          blocking: warning        # Gate level: "none" (advisory, the default) | "warning" | "error"
          scope: full              # Scan and report the whole project, not just changed files
        #   comment: false           # Disable the sticky PR summary comment
        #   review-comments: false   # Disable inline review comments on changed lines
        #   commit-status: false     # Disable the commit status (score + counts, links to the run)
        #   version: "0.4.0"         # Pin to a specific react-doctor version instead of "latest"
        #   directory: apps/web      # Scan a sub-directory (default: ".")
        #   project: "web,admin"     # In a monorepo, scan specific workspace project(s)
