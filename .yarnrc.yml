# Use a real node_modules tree rather than Yarn PnP.
# (Yarn's default is "pnp", which Next.js and much of the JS tooling
# ecosystem still handle poorly.)
nodeLinker: node-modules

# Pin the Yarn version. The release binary is committed under .yarn/releases so
# CI and Vercel don't need Corepack to bootstrap it: a runner whose global
# `yarn` is the image's Yarn 1 reads this field and hands off to the binary
# below, instead of refusing to run because package.json pins yarn@4.12.0.
# Keep this version and package.json's `packageManager` field in step.
yarnPath: .yarn/releases/yarn-4.12.0.cjs
